<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 · Velorah &amp; Apogee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#FAF9F6; color:#1A1A1A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { transition: transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 20px 44px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-4xl w-full text-center">
    <div class="text-[#888780] text-[13px] tracking-[0.3em] uppercase mb-4">我的作品集</div>
    <h1 class="text-[#1A1A1A] text-[40px] sm:text-[56px] font-semibold leading-[1.05] mb-3">两个作品，一次呈现。</h1>
    <p class="text-[#6B6B66] text-[15px] sm:text-[17px] max-w-xl mx-auto mb-12">每个作品，都是一次完整的表达。</p>

    <div class="grid sm:grid-cols-2 gap-6 text-left">
      <a href="./velorah/" class="card block rounded-3xl bg-[#FFFFFF] border border-[#E3E1DA] p-8">
        <div class="text-[#888780] text-[12px] tracking-[0.2em] uppercase mb-3">品牌 · 影视风</div>
        <h2 class="text-[#1A1A1A] text-[26px] font-semibold mb-2">Velorah®</h2>
        <p class="text-[#6B6B66] text-[14px] leading-relaxed mb-6">安静的电影感落地页——全屏视频、玻璃拟态导航、品牌宣言、工作室卡片、期刊与联系表单。</p>
        <span class="text-[#1A1A1A] text-[14px] inline-flex items-center gap-2">打开站点 →</span>
      </a>

      <a href="./apogee/" class="card block rounded-3xl bg-[#FFFFFF] border border-[#E3E1DA] p-8">
        <div class="text-[#888780] text-[12px] tracking-[0.2em] uppercase mb-3">产品 · 数据</div>
        <h2 class="text-[#1A1A1A] text-[26px] font-semibold mb-2">Apogee</h2>
        <p class="text-[#6B6B66] text-[14px] leading-relaxed mb-6">暗色数据驱动主页，含实时营收卡片，以及平台 / 定价 / 资源 / 洞察板块与联系表单。</p>
        <span class="text-[#1A1A1A] text-[14px] inline-flex items-center gap-2">打开站点 →</span>
      </a>
    </div>

    <div class="text-[#B4B2A9] text-[12px] mt-12">托管于 GitHub Pages</div>
  </div>
</body>
</html>
